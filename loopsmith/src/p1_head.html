<title>Loopsmith GIF Studio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Bungee&family=Fredoka:wght@600&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&family=Pacifico&family=Playfair+Display:ital,wght@1,800&family=Press+Start+2P&display=swap">
<style>
/* Layout: light-table workbench — stage, transport, takes and frame strip on the left; a tabbed rail (Create · Edit · Export) on the right */
:root{
  --bg:#e9ecf2; --panel:#f8f9fc; --raised:#ffffff; --ink:#141824; --muted:#5b6275; --line:#cfd4df;
  --accent:#2f3fe0; --accent-ink:#ffffff; --accent-soft:rgba(47,63,224,.10); --tape:#f3c33a;
  --stage:#10131c; --stage-ink:#c7cde0; --check-a:#ffffff; --check-b:#d9dde6;
  --good:#16794a; --warn:#a4560b;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Instrument Sans","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1017; --panel:#161a24; --raised:#1f2433; --ink:#e8ebf3; --muted:#9aa2b8; --line:#2a3040;
  --accent:#7d8bff; --accent-ink:#0d1017; --accent-soft:rgba(125,139,255,.14); --tape:#f3c33a;
  --stage:#05070b; --stage-ink:#c7cde0; --check-a:#2a3040; --check-b:#1d2230;
  --good:#5fd39a; --warn:#f0a75c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1017; --panel:#161a24; --raised:#1f2433; --ink:#e8ebf3; --muted:#9aa2b8; --line:#2a3040;
  --accent:#7d8bff; --accent-ink:#0d1017; --accent-soft:rgba(125,139,255,.14); --tape:#f3c33a;
  --stage:#05070b; --stage-ink:#c7cde0; --check-a:#2a3040; --check-b:#1d2230;
  --good:#5fd39a; --warn:#f0a75c; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:1320px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;gap:8px;min-width:0;max-width:780px}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(30px,4.6vw,48px);letter-spacing:-.025em;line-height:1;margin:0;text-wrap:balance}
h1 .dot{display:inline-block;width:.46em;height:.46em;border-radius:50%;background:var(--tape);margin-left:.08em;vertical-align:.1em;animation:blink 1.2s steps(2) infinite}
@keyframes blink{50%{background:var(--accent)}}
.sub{color:var(--muted);margin:0;max-width:66ch}
.facts{display:flex;flex-wrap:wrap;gap:4px 16px;margin:0;padding:0;list-style:none;font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.facts li{display:flex;align-items:center;gap:6px}
.facts li::before{content:"";width:6px;height:6px;border-radius:2px;background:var(--tape)}
.badge{font-family:var(--f-mono);font-size:12px;color:var(--muted);border:1px solid var(--line);padding:4px 10px;border-radius:999px;white-space:nowrap}
.badge b{color:var(--ink);font-weight:600}
.grid{display:grid;grid-template-columns:minmax(0,1.32fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:980px){.grid{grid-template-columns:minmax(0,1fr)}}
.bench,.rail{display:flex;flex-direction:column;gap:14px;min-width:0}
.stage{background:var(--stage);border-radius:14px;padding:clamp(12px,2.6vw,26px);display:grid;place-items:center;position:relative;overflow:hidden;min-height:220px;
  background-image:linear-gradient(45deg,rgba(255,255,255,.035) 25%,transparent 25%,transparent 75%,rgba(255,255,255,.035) 75%),linear-gradient(45deg,rgba(255,255,255,.035) 25%,transparent 25%,transparent 75%,rgba(255,255,255,.035) 75%);
  background-size:24px 24px;background-position:0 0,12px 12px}
#view{display:block;border-radius:4px;box-shadow:0 18px 50px rgba(0,0,0,.45);touch-action:none;cursor:crosshair;max-width:100%}
.corner{position:absolute;font-family:var(--f-mono);font-size:11px;color:var(--stage-ink);opacity:.75;letter-spacing:.04em;max-width:45%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl{top:8px;left:14px}.tr{top:8px;right:14px}
.drop{position:absolute;inset:8px;border:2px dashed #fff;border-radius:12px;background:rgba(47,63,224,.6);color:#fff;display:grid;place-items:center;font-weight:600;font-size:16px;text-align:center;padding:16px}
.transport,.canvasrow{display:flex;align-items:center;gap:8px 10px;flex-wrap:wrap}
.scrub{flex:1 1 160px;min-width:0;accent-color:var(--accent)}
.tc{font-family:var(--f-mono);font-size:13px;font-variant-numeric:tabular-nums;color:var(--muted);min-width:15ch;text-align:right}
.canvasrow label{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.canvasrow select{width:auto;padding:6px 8px;font-size:13px}
.spacer{flex:1}
.seam{font-family:var(--f-mono);font-size:12px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.seam.ok{color:var(--good);border-color:currentColor}
.seam.warn{color:var(--warn);border-color:currentColor}
.sect{display:flex;flex-direction:column;gap:8px;min-width:0}
.secthead{display:flex;align-items:baseline;gap:6px 10px;flex-wrap:wrap}
.secthead h3{margin:0;font-family:var(--f-display);font-weight:800;font-size:16px;letter-spacing:-.01em}
.hint{font-size:12px;color:var(--muted)}
.secthead .push{margin-left:auto}
.vars{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:560px){.vars{grid-template-columns:repeat(2,minmax(0,1fr))}}
.var{position:relative;padding:0;border:2px solid transparent;border-radius:10px;background:var(--stage);overflow:hidden;display:block}
.var canvas{display:block;width:100%;height:auto}
.vl{position:absolute;left:6px;bottom:6px;font-family:var(--f-mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;background:rgba(0,0,0,.6);color:#fff;padding:2px 6px;border-radius:5px;max-width:calc(100% - 12px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.var.on{border-color:var(--tape)}
.var:hover{border-color:var(--accent)}
.strip{display:flex;gap:6px;overflow-x:auto;padding:8px;background:var(--stage);border-radius:10px;scrollbar-width:thin}
.strip canvas{flex:0 0 auto;border-radius:3px;outline:2px solid transparent;cursor:pointer;opacity:.8}
.strip canvas.on{outline-color:var(--tape);opacity:1}
.takes{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.take{flex:0 0 auto;width:96px;padding:0;border-radius:9px;overflow:hidden;background:var(--panel);text-align:left}
.take canvas{display:block;width:100%;height:auto;background:var(--stage)}
.take span,.tpl span{display:block;font-size:11px;padding:4px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted);font-weight:500}
.empty{font-size:13px;color:var(--muted);margin:0}
.tabs{display:flex;gap:4px;padding:4px;background:var(--panel);border:1px solid var(--line);border-radius:12px}
.tab{flex:1;border:0;background:transparent;padding:9px 10px;border-radius:9px;font-weight:600;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--raised);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.pane{display:flex;flex-direction:column;gap:14px;min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card h2{font-family:var(--f-display);font-weight:800;font-size:18px;margin:0;letter-spacing:-.01em;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.card h2 small{font-family:var(--f-mono);font-weight:400;font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
textarea,select,input[type=text]{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%;min-width:0}
textarea{resize:vertical;min-height:84px}
textarea:focus,select:focus,input:focus,button:focus-visible,.chip:focus-visible,label.addphoto:focus-within,.strip canvas:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button{font:inherit;font-weight:600;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:9px 14px;cursor:pointer}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.primary:hover{filter:brightness(1.08)}
button.big{width:100%;padding:12px 16px;font-size:16px}
button.small{padding:5px 10px;font-size:13px}
button:disabled{opacity:.55;cursor:not-allowed}
.icon-btn{width:40px;height:40px;padding:0;display:grid;place-items:center;font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:13px;font-weight:500;padding:6px 10px;border-radius:999px;background:transparent}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.note{font-size:13px;color:var(--muted);margin:0}
.note.ok{color:var(--good)}.note.warn{color:var(--warn)}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.fields label{display:flex;flex-direction:column;gap:4px;font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;min-width:0}
.fields .wide{grid-column:1/-1}
@media (max-width:420px){.fields,.insp{grid-template-columns:minmax(0,1fr)}}
.photos{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.addphoto,.btnlike{display:inline-flex;align-items:center;gap:6px;font-weight:600;border:1px dashed var(--line);border-radius:10px;padding:9px 14px;cursor:pointer;background:var(--bg)}
.btnlike{border-style:solid}
.addphoto:hover,.btnlike:hover{border-color:var(--accent)}
.thumbs{display:flex;gap:6px;flex-wrap:wrap}
.thumb{position:relative;width:48px;height:48px;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:var(--stage)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb button{position:absolute;top:2px;right:2px;width:18px;height:18px;padding:0;border-radius:50%;font-size:10px;line-height:1;background:rgba(0,0,0,.7);color:#fff;border:0}
.tpls{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.tpl{padding:0;border-radius:10px;overflow:hidden;background:var(--panel);text-align:left}
.tpl canvas{display:block;width:100%;height:auto;background:var(--stage)}
.layer-list{display:flex;flex-direction:column;gap:4px;max-height:320px;overflow:auto}
.lrow{display:grid;grid-template-columns:30px minmax(0,1fr) auto;align-items:center;gap:6px;padding:5px 6px;border:1px solid var(--line);border-radius:9px;background:var(--bg);cursor:pointer}
.lrow.sel{border-color:var(--accent);background:var(--accent-soft)}
.lrow.off .nm{opacity:.45}
.nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}
.nm small{color:var(--muted);font-family:var(--f-mono);font-size:11px}
.lbtns{display:flex;gap:2px}
.mini{width:28px;height:28px;padding:0;border-radius:7px;font-size:12px;display:grid;place-items:center;font-weight:500}
.insp{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld.wide{grid-column:1/-1}
.fld>span{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;display:flex;justify-content:space-between;gap:6px}
.fld output{font-family:var(--f-mono);text-transform:none;letter-spacing:0;color:var(--ink);font-weight:400}
input[type=range]{width:100%;accent-color:var(--accent)}
input[type=color]{width:38px;height:32px;padding:2px;border:1px solid var(--line);border-radius:8px;background:var(--bg);cursor:pointer}
input[type=color]:disabled{opacity:.35}
.swatches{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.sw{display:inline-flex;align-items:center;gap:2px}
.check{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--ink);text-transform:none;letter-spacing:0;font-weight:500}
.checks{display:flex;flex-direction:column;gap:7px}
.seg{display:flex;flex-wrap:wrap;gap:4px;padding:4px;background:var(--bg);border:1px solid var(--line);border-radius:10px}
.seg button{flex:1 1 auto;border:0;background:transparent;padding:7px 10px;border-radius:7px;font-size:13px}
.seg button[aria-checked="true"]{background:var(--raised);box-shadow:0 1px 3px rgba(0,0,0,.16)}
.meter{height:8px;background:var(--bg);border:1px solid var(--line);border-radius:999px;overflow:hidden}
.meter i{display:block;height:100%;width:0;background:repeating-linear-gradient(90deg,var(--accent) 0 10px,var(--tape) 10px 20px);transition:width .15s}
.result{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
.rprev{width:150px;max-width:100%;border-radius:8px;overflow:hidden;border:1px solid var(--line);
  background-color:var(--check-a);background-image:linear-gradient(45deg,var(--check-b) 25%,transparent 25%,transparent 75%,var(--check-b) 75%),linear-gradient(45deg,var(--check-b) 25%,transparent 25%,transparent 75%,var(--check-b) 75%);background-size:16px 16px;background-position:0 0,8px 8px}
.rprev img,.rprev video{display:block;width:100%;height:auto}
.rside{display:flex;flex-direction:column;gap:8px;min-width:0;flex:1 1 160px}
.stats{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;display:flex;flex-direction:column;gap:2px}
.stats b{color:var(--ink);font-weight:600}
details summary{cursor:pointer;font-weight:600;font-size:14px}
pre{font-family:var(--f-mono);font-size:12px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;overflow:auto;max-height:280px;margin:8px 0 0;white-space:pre}
.kbd{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
@media (prefers-reduced-motion: reduce){h1 .dot{animation:none}.meter i{transition:none}}
</style>
