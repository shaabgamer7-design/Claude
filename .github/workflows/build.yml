name: Build Windows installer

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a GitHub Release (creates the v<version> tag)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: System libraries for audio and headless Qt
        run: sudo apt-get update -q && sudo apt-get install -y -q libportaudio2 libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: pip install -e ".[gui,dev]"
      - run: pytest -q
        env:
          QT_QPA_PLATFORM: offscreen

  windows:
    needs: test
    runs-on: windows-latest
    timeout-minutes: 45
    outputs:
      version: ${{ steps.installer.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ".[gui,local]" pyinstaller pillow
      - run: python packaging/make_icon.py
      - run: pyinstaller packaging/freeflow.spec --noconfirm --clean
      - name: Self-test the app
        timeout-minutes: 10
        shell: pwsh
        env:
          FREEFLOW_SELFTEST_TRANSCRIBE: "1"
        run: |
          $report = Join-Path $PWD "selftest.txt"
          $p = Start-Process -FilePath "dist\FreeFlow\FreeFlow.exe" -ArgumentList "--selftest", "`"$report`"" -PassThru
          $null = $p.Handle  # keeps ExitCode readable after WaitForExit
          $finished = $p.WaitForExit(480000)
          if (-not $finished) { $p.Kill() }
          Get-Content $report
          "### Windows self-test`n``````n$(Get-Content $report -Raw)``````" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          if (-not $finished -or $p.ExitCode -ne 0) {
            "--- library log"
            Get-Content "$report.log" -Tail 80
          }
          if (-not $finished) { exit 1 }
          exit $p.ExitCode
      - name: Build installer
        id: installer
        shell: pwsh
        run: |
          $version = python -c "import freeflow; print(freeflow.__version__)"
          "version=$version" | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc /Q "/DAppVersion=$version" packaging\windows\freeflow.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: FreeFlow-Windows
          path: dist/FreeFlow-Setup-*.exe
          if-no-files-found: error

  release:
    # On a pushed v* tag, or when run by hand with "release" ticked (the
    # release then creates the tag on the commit that was built and tested).
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release)
    needs: [windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.windows.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: FreeFlow ${{ needs.windows.outputs.version }} for Windows
          files: installers/*
          generate_release_notes: true
          body: |
            **Download `FreeFlow-Setup-${{ needs.windows.outputs.version }}.exe` below** and run it (Windows 10/11, 64-bit, no admin rights needed).

            If Windows shows "Windows protected your PC", click **More info → Run anyway** (the installer isn't code-signed).

            On first launch a short setup walks you through choosing speech recognition and AI editing, adding API keys and testing your microphone. Then hold **Right Ctrl**, speak, and let go.
