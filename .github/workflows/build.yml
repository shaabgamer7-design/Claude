name: Build installers

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: System libraries for audio and headless Qt
        run: sudo apt-get update -q && sudo apt-get install -y -q libportaudio2 libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: pip install -e ".[gui,dev]"
      - run: pytest -q
        env:
          QT_QPA_PLATFORM: offscreen

  macos:
    needs: test
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ".[gui,local]" pyinstaller pillow
      - run: python packaging/make_icon.py
      - run: pyinstaller packaging/freeflow.spec --noconfirm --clean
      - name: Sign (ad hoc)
        run: |
          codesign --force --deep --sign - dist/FreeFlow.app
          codesign --verify --deep --strict --verbose=2 dist/FreeFlow.app
      - name: Self-test the app bundle
        timeout-minutes: 10
        env:
          FREEFLOW_SELFTEST_TRANSCRIBE: "1"
        run: |
          set +e
          dist/FreeFlow.app/Contents/MacOS/FreeFlow --selftest "$PWD/selftest.txt"
          status=$?
          cat selftest.txt
          exit $status
      - run: bash packaging/macos/make_dmg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: FreeFlow-macOS
          path: dist/FreeFlow-*.dmg
          if-no-files-found: error

  windows:
    needs: test
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ".[gui,local]" pyinstaller pillow
      - run: python packaging/make_icon.py
      - run: pyinstaller packaging/freeflow.spec --noconfirm --clean
      - name: Self-test the app
        timeout-minutes: 10
        shell: pwsh
        env:
          FREEFLOW_SELFTEST_TRANSCRIBE: "1"
        run: |
          $report = Join-Path $PWD "selftest.txt"
          $p = Start-Process -FilePath "dist\FreeFlow\FreeFlow.exe" -ArgumentList "--selftest", "`"$report`"" -Wait -PassThru
          Get-Content $report
          exit $p.ExitCode
      - name: Build installer
        shell: pwsh
        run: |
          $version = python -c "import freeflow; print(freeflow.__version__)"
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc "/DAppVersion=$version" packaging\windows\freeflow.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: FreeFlow-Windows
          path: dist/FreeFlow-Setup-*.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: installers/*
          generate_release_notes: true
